<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smash2le</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>SMASH<span>2</span>LE</h1>
      <p>Devine le combattant. Autant de fois que tu veux.</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" data-open="help" title="Règles">?</button>
      <button class="icon-btn" data-open="stats" title="Statistiques">📊</button>
      <button class="icon-btn" data-open="settings" title="Réglages">⚙️</button>
    </div>
  </header>

  <nav class="modes" id="modes">
    <button data-mode="classic" class="active"><b>Classique</b><small>Indices par attribut</small></button>
    <button data-mode="enigme"><b>Énigme</b><small>Attributs révélés un à un</small></button>
    <button data-mode="emoji"><b>Emoji</b><small>Devine avec des emojis</small></button>
    <button data-mode="timeattack"><b>Chrono</b><small>Max en 3 minutes</small></button>
    <button data-mode="survival"><b>Survie</b><small>Réserve d'essais limitée</small></button>
  </nav>

  <main id="game"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" title="Fermer">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="foot">Jeu de fan non officiel, fait pour jouer en local. Les noms des personnages appartiennent à leurs ayants droit.</footer>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
